# Generated to match .github/gates.toml. The `budgets` gate runs tools/check_gates.py, which FAILS
# if this file's paths/branches drift from that declaration -- because tools/expected_gates.py tells
# an agent which check-runs to poll from gates.toml, and a skipped workflow reports no status at all,
# so a drifted filter makes an agent wait forever for a gate that will never appear.
name: experiments

on:
  push:
    branches:
      - main
      - line/**
    paths:
      - experiments/**
      - tools/check_experiments.py
      - tools/render_verdict.py
      - .github/gates.toml
      - tools/check_gates.py
  pull_request:
    paths:
      - experiments/**
      - tools/check_experiments.py
      - tools/render_verdict.py
      - .github/gates.toml
      - tools/check_gates.py
  workflow_dispatch:

jobs:
  experiments:
    name: experiments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # append-only checks compare against the merge base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pyyaml
      - name: pre-registration sealed, nulls present, verdict computed not asserted
        run: python tools/check_experiments.py --changed --ref origin/main
