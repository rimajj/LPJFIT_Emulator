# Generated to match .github/gates.toml. The `budgets` gate runs tools/check_gates.py, which FAILS
# if this file's paths/branches drift from that declaration -- because tools/expected_gates.py tells
# an agent which check-runs to poll from gates.toml, and a skipped workflow reports no status at all,
# so a drifted filter makes an agent wait forever for a gate that will never appear.
name: lint

on:
  push:
    branches:
      - main
      - line/**
    paths:
      - "**/*.py"
      - pyproject.toml
      - .github/gates.toml
      - tools/check_gates.py
  pull_request:
    paths:
      - "**/*.py"
      - pyproject.toml
      - .github/gates.toml
      - tools/check_gates.py
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet ruff
      # EVERY .py in the repo, not just the package. The predecessor gated a 17-file subdirectory and
      # left 131 tracked scripts linted by nothing; B905 (zip without strict=) and B023 (closure over
      # a loop variable) silently corrupt paired data, which is exactly what an analysis script does.
      - run: ruff check .
      - run: ruff format --check .
