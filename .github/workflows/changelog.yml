# Generated to match .github/gates.toml. The `budgets` gate runs tools/check_gates.py, which FAILS
# if this file's paths/branches drift from that declaration -- because tools/expected_gates.py tells
# an agent which check-runs to poll from gates.toml, and a skipped workflow reports no status at all,
# so a drifted filter makes an agent wait forever for a gate that will never appear.
name: changelog

on:
  push:
    branches:
      - main
    paths:
      - changelog.d/**
      - CHANGELOG.md
      - tools/collate_changelog.py
      - .github/gates.toml
      - tools/check_gates.py
  pull_request:
    paths:
      - changelog.d/**
      - CHANGELOG.md
      - tools/collate_changelog.py
      - .github/gates.toml
      - tools/check_gates.py
  workflow_dispatch:

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # An uncollated fragment on a line branch is CORRECT; on main it is debt. The predecessor let
      # 56 fragments sit for 13 days because the collation chore had no triggering event -- it now
      # runs inside the merge lock, and this gate is what makes skipping it visible.
      - run: python tools/collate_changelog.py --check
