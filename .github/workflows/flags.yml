# Generated to match .github/gates.toml. The `budgets` gate runs tools/check_gates.py, which FAILS
# if this file's paths/branches drift from that declaration -- because tools/expected_gates.py tells
# an agent which check-runs to poll from gates.toml, and a skipped workflow reports no status at all,
# so a drifted filter makes an agent wait forever for a gate that will never appear.
name: flags

on:
  push:
    branches:
      - main
      - line/**
    paths:
      - config/flags.toml
      - src/**
      - .github/gates.toml
      - tools/check_gates.py
  pull_request:
    paths:
      - config/flags.toml
      - src/**
      - .github/gates.toml
      - tools/check_gates.py
  workflow_dispatch:

jobs:
  flags:
    name: flags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # "Opt-in, default byte-identical" protects you from enabling too early, NOT from never
      # enabling. Three predecessor flags whose defaults were known wrong sat unflipped for weeks.
      - run: python tools/check_flags.py
