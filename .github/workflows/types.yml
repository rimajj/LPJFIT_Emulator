# Generated to match .github/gates.toml. The `budgets` gate runs tools/check_gates.py, which FAILS
# if this file's paths/branches drift from that declaration -- because tools/expected_gates.py tells
# an agent which check-runs to poll from gates.toml, and a skipped workflow reports no status at all,
# so a drifted filter makes an agent wait forever for a gate that will never appear.
name: types

on:
  push:
    branches:
      - main
      - line/**
    paths:
      - src/**
      - pyproject.toml
      - .github/gates.toml
      - tools/check_gates.py
  pull_request:
    paths:
      - src/**
      - pyproject.toml
      - .github/gates.toml
      - tools/check_gates.py
  workflow_dispatch:

jobs:
  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # types-PyYAML is NOT optional decoration: mypy `strict` names that stub package itself, and
      # without it `import yaml` in src/vegemu/paths.py is an `import-untyped` error that no line can
      # fix in its own code. pyproject's `dev` extra has declared it since it was written -- this
      # step just never installed it, so the gate failed on a dependency the project already
      # declared. Installing the extra outright would ALSO install polars, which ships `py.typed`
      # and would put the package under a stricter checking universe than the one it was written
      # against (see the `ignore_missing_imports` override and its stated cost in pyproject.toml);
      # that is a deliberate change to make on purpose, not a side effect of fixing a stub.
      - run: pip install --quiet mypy numpy types-PyYAML
      - run: mypy --strict src/vegemu
