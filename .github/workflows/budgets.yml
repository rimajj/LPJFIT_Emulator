# Generated to match .github/gates.toml. The `budgets` gate runs tools/check_gates.py, which FAILS
# if this file's paths/branches drift from that declaration -- because tools/expected_gates.py tells
# an agent which check-runs to poll from gates.toml, and a skipped workflow reports no status at all,
# so a drifted filter makes an agent wait forever for a gate that will never appear.
name: budgets

on:
  push:
    branches:
      - main
      - line/**
    paths:
      - "**/*.md"
      - config/budgets.toml
      - .claude/skills/**
      - tools/check_budgets.py
      - .github/gates.toml
      - tools/check_gates.py
  pull_request:
    paths:
      - "**/*.md"
      - config/budgets.toml
      - .claude/skills/**
      - tools/check_budgets.py
      - .github/gates.toml
      - tools/check_gates.py
  workflow_dispatch:

jobs:
  budgets:
    name: budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # check_budgets consults git history for the owner-approval trailer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pyyaml
      - name: document budgets, MEMORY row format, root allowlist, skill caps
        run: python tools/check_budgets.py
      - name: secrets
        run: python tools/check_secrets.py
      - name: CI gate declaration matches the workflows
        run: python tools/check_gates.py
