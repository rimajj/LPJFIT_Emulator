# Generated to match .github/gates.toml. The `budgets` gate runs tools/check_gates.py, which FAILS
# if this file's paths/branches drift from that declaration -- because tools/expected_gates.py tells
# an agent which check-runs to poll from gates.toml, and a skipped workflow reports no status at all,
# so a drifted filter makes an agent wait forever for a gate that will never appear.
name: campaigns

on:
  push:
    branches:
      - main
    paths:
      - campaigns/**
      - .github/gates.toml
      - tools/check_gates.py
  pull_request:
    paths:
      - campaigns/**
      - .github/gates.toml
      - tools/check_gates.py
  workflow_dispatch:

jobs:
  campaigns:
    name: campaigns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # An open campaign on a LINE branch is normal -- that is what a running job looks like. It is
      # only debt once it reaches main unharvested, which is why this gate is main-only.
      - run: python tools/campaigns.py --check
