# Generated to match .github/gates.toml. The `budgets` gate runs tools/check_gates.py, which FAILS
# if this file's paths/branches drift from that declaration -- because tools/expected_gates.py tells
# an agent which check-runs to poll from gates.toml, and a skipped workflow reports no status at all,
# so a drifted filter makes an agent wait forever for a gate that will never appear.
name: test

on:
  push:
    branches:
      - main
      - line/**
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/gates.toml
      - tools/check_gates.py
  pull_request:
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/gates.toml
      - tools/check_gates.py
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # FULL history, not the default depth-1 clone. tests/test_gate_selection.py asks git for a real
      # comparison base (`HEAD~1`) because the tool under test classifies "no diff" against "cannot
      # compute a diff" -- the confusion that hid a pathsafety violation on main. On a shallow
      # checkout `HEAD~1` does not resolve, so the tool correctly answers "cannot compute" and the
      # test correctly fails: the environment was wrong, not the test. Depth 2 would satisfy today's
      # assertions; 0 is the honest answer for a repo whose tooling reasons about history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet -e ".[dev]"
      # The binary-format round-trip is a PROPERTY test over synthetic records. Tests marked
      # needs_real_data are skipped here (no /p mount on a GitHub runner) and must be run on the
      # cluster -- a format proven only against synthetic data is not proven.
      - run: pytest -q -m "not needs_real_data"
