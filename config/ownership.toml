# Path ownership — machine-read, enforced by the commit guard and the edit-time path guard.
#
# WHY THIS IS SIX RULES AND NOT A FIFTEEN-ROW PROSE TABLE. The predecessor's ownership map grew to
# fifteen rows precisely BECAUSE nothing enforced it: an audit found ~60 % of its source tree unowned,
# and the map was patched by hand each time that bit. Here `unowned = "deny"` makes an unowned path a
# blocked commit, so adding a rule is forced at the moment of the first write. The map stays short and,
# more importantly, stays TRUE.

[meta]
schema_version = 1
# What happens to a staged path matching no rule below.
#   "deny"  -> the commit is blocked; add a rule (that is the point)
#   "warn"  -> printed, allowed
unowned = "deny"

# The one sanctioned cross-line write. tools/inbound.py appends a dated INBOUND block to another
# line's STATE.md; the guards whitelist it by tool, not by path.
inbound_tool = "tools/inbound.py"

# ---------------------------------------------------------------------------
# Exclusive: LINE AGAINST LINE. Only the owning line may write these FROM ANOTHER LINE'S BRANCH.
#
# ⚠ THE INTEGRATOR IS NOT BOUND BY THESE, and never was -- owner instruction, 2026-09-17, and the
# code has always agreed: check_ownership.py resolves the line from the branch name, so on `main`
# there is no line and O01 cannot fire; path-guard.sh guards each of these behind `[[ -n "$LINE" ]]`.
# What was wrong until 2026-09-17 was the PROSE -- the session greeting told every integrator
# session that feature work "does not belong here" and would be refused, which was false, and sent
# session after session away to a line worktree for work it could have done on the spot.
#
# So these rules exist to stop line D writing line T's files, which is what keeps merges
# conflict-free. They do not, and did not, fence off the integrator.
# ---------------------------------------------------------------------------

[[rule]]
globs = ["lines/D/**", "journal/D/**", "campaigns/D/**"]
owner = "D"
kind = "exclusive"

[[rule]]
globs = ["lines/T/**", "journal/T/**", "campaigns/T/**"]
owner = "T"
kind = "exclusive"

[[rule]]
globs = ["lines/X/**", "journal/X/**", "campaigns/X/**"]
owner = "X"
kind = "exclusive"

[[rule]]
# D owns everything that reads or writes LPJmL-FIT's own file formats, and the corpus that comes
# out of them: the restart reader/writer, the .clm reader/writer, the NetCDF writers, provenance.
globs = ["src/vegemu/binfmt/**", "src/vegemu/corpus/**", "scripts/corpus_*.py", "scripts/sbatch_cmodel.sh"]
owner = "D"
kind = "exclusive"

[[rule]]
# T owns the models and everything that trains or runs them.
globs = ["src/vegemu/models/**", "src/vegemu/train/**", "scripts/train_*.py", "scripts/sbatch_train.sh"]
owner = "T"
kind = "exclusive"

[[rule]]
# X owns the experiment corpus. Pre-registrations are additionally immutable once sealed (that is
# enforced separately, by hash, in tools/check_experiments.py — ownership alone is not enough).
globs = ["experiments/**"]
owner = "X"
kind = "exclusive"

# ---------------------------------------------------------------------------
# Shared, additive-only: any line may ADD here; nobody restructures.
# ---------------------------------------------------------------------------

[[rule]]
globs = [
  "changelog.d/*.md",          # a new fragment only; CHANGELOG.md itself is integrator-owned
  "docs/decisions/*.md",       # your own new record; accepted ones are immutable
  "docs/reference/*.md",
  ".claude/skills/**",
  # ⚠ SHARED, NOT INTEGRATOR-OWNED, even though it sits beside the enforcement machinery. A
  # SessionStart/Skill hook appends one line to it whenever ANY session invokes a skill, so a line
  # session dirties it just by following CLAUDE.md's "check whether a skill covers it". Putting it
  # in the integrator block would mean a line could neither commit its own work nor leave the tree
  # clean -- the Stop hook then blocks, and the only way out is a guard skip. It is append-only by
  # construction (one timestamped row per invocation) so `owner = "*"` costs nothing: any line may
  # add a row, nobody rewrites it. Found 2026-09-21, when `unowned = "deny"` refused the first
  # commit to carry an append -- the mechanism doing exactly what the comment below describes.
  ".claude/skill-usage.log",
  "src/vegemu/**",             # the shared library surface not carved out above
  "tests/**",
  "tools/**",
  "scripts/**",
]
owner = "*"
kind = "shared"

# ---------------------------------------------------------------------------
# Integrator-only: request the change, do not make it from a line. (The integrator, on `main`,
# writes these directly -- and, since 2026-09-17, everything above them too.)
# ---------------------------------------------------------------------------

[[rule]]
globs = [
  "CLAUDE.md", "MEMORY.md", "PLAN.md", "README.md", "CHANGELOG.md",
  "config/**", ".github/**",
  # The enforcement machinery itself. A line that could edit the hook that constrains it would make
  # the whole scheme circular -- the same reason config/budgets.toml is here.
  #
  # This rule was ADDED because `unowned = "deny"` caught its absence on the very first commit that
  # touched .claude/hooks/. That is the mechanism working exactly as intended: the predecessor's map
  # drifted to fifteen rows and stopped being true precisely because unowned paths were allowed
  # through silently, so an unowned path here forces a rule at the moment of first write.
  ".claude/settings.json", ".claude/hooks/**", ".githooks/**",
  "pyproject.toml", "uv.lock", ".gitignore", ".gitattributes",
]
owner = "integrator"
kind = "exclusive"
