schema_version: 1

exp_id: X-20260914-pilot-composition-response
line: X

status: sealed

title: "Can the emulator predict how a cell's MIX OF TREE TYPES shifts under a perturbed climate?"
question: >
  Shown a cell's real present-day forest and a perturbed climate, can the emulator predict the
  CHANGE in the share of stems held by each of the seven tree types better than the best
  information-free competitor -- which is "every type's share moves by the same fraction of what it
  already holds"? If it cannot, then the shipped synthesiser's inability to shift species at all
  costs nothing measurable, and that limitation may continue to ship disclosed. If it can, that
  limitation is a real capability gap and the synthesiser must stop copying composition.

estimand:
  name: skill_composition_mean
  definition: >
    For each of the seven tree types, compute 1 - SUM((dpred - dtrue)^2) / SUM(dtrue^2) pooled over
    all scored (cell, climate) pairs, where dtrue = pft_frac_i(perturbed point) - pft_frac_i(control)
    is a WITHIN-CELL PAIRED CONTRAST. The statistic is the unweighted mean of the seven.
    Denominator SUM(dtrue^2), not the variance of dtrue: that pins the no-response null analytically
    at exactly 0.0.

    ⚠ A SEPARATE ESTIMAND FROM THE SEALED RESPONSE TEST, DELIBERATELY AND NOT AN EXTENSION OF IT.
    X-20260909-pilot-warming-response is sealed around "the unweighted mean of the seven
    RESPONSE_QUANTITIES" and its recorded 0.545304 reproduces only while that tuple has exactly
    those seven members. Appending composition to it would silently redefine what a sealed
    experiment measures. The two numbers are quoted SEPARATELY and NEVER summed or averaged.
    `tests/test_composition_arm.py` asserts RESPONSE_QUANTITIES is unchanged.

    ⚠ pft_frac_i IS THE SHARE OF THE CELL'S STEMS OF TYPE i, COUNTED PER INDIVIDUAL AND NOT WEIGHTED
    BY BIOMASS (corpus/state.py builds it as bincount(ids) / ids.size). A type that is numerically
    rare but holds the canopy therefore scores small. That is a property of the definition, not of
    the emulator, and it belongs in any sentence quoting one of these numbers.

    THE SEVEN SHARES SUM TO 1 to within 2e-16 on every treed row, so only six are free. Every arm is
    scored under the identical redundancy, so the comparison is fair, but no single term may be read
    as independent evidence and the mean of seven is not a mean of seven independent skills.

    TREELESS HANDLING, FIXED HERE AND NOT LATER -- METHOD DECISION 1 OF 2. corpus/state.py writes
    0.0 into every pft_frac_* of a treeless cell. As a LEVEL that is defensible; as a CHANGE it is
    not, because it reads as "type 3's share fell from 0.81 to 0.00" when there is no mix at all,
    and it is the same collapse that stems_per_patch already scores in full in the sealed response
    arm. Measured, leaving it in inflates the total squared change by 15-18 % on most types and
    would let a model buy apparent species-shift skill by predicting die-off.
    score.blank_treeless_composition sets those to NaN and a pair drops per quantity when the arm OR
    the control has no stems: 542 of 5,800 pairs, being 493 from the 17 cells already treeless under
    their own control plus 49 arms that went treeless. 5,258 pairs score.
    ⚠ THE DISCLOSURE THAT TRAVELS WITH EVERY NUMBER FROM THIS EXPERIMENT: composition is scored
    where a forest existed at BOTH ends, which selects toward the milder perturbations.

    ONE DENOMINATOR FOR EVERY ARM -- METHOD DECISION 2 OF 2. score.skill_vs_no_change builds its
    denominator over rows where the PREDICTION is finite, so an arm that declines to answer on the
    hard rows would be scored on an easier subset than its competitors. Here that is a live effect,
    not a precaution: 9.3 % of pairs are undefined and they cluster at the 17 cells treeless under
    their own control. Of 36,806 scorable cell-quantity entries at 15 deg the fills needed are
    nearest_cell_response 2,296, nearest_analogue_response 1,253, shuffled_cells 3,360, and zero for
    the other four. Every arm is therefore scored on the IDENTICAL truth-finite set and a missing
    prediction is IMPUTED AS NO CHANGE. That direction is the conservative one -- it pulls a
    negative null UP toward zero, making the competitor stronger and the bar harder -- and it keeps
    no_response pinned analytically at exactly 0.0.
  reference_basis: >
    LPJmL-FIT 5.6.004, binary built 2026-08-12 -- ONE binary for all 6,000 runs, so no
    build-mismatch arm is needed. Pilot corpus v1: 200 cells x 30 climates x 1 seed, each a
    single-cell 1000-year spin-up, npatch=25, tree PFTs only, base climate window 1970-1999,
    constant CO2 and CO2 never written. State is read from the end-of-spin-up restart file, which is
    UNCENSORED, so it includes stems under 5 m that the per-tree text output drops. 5,800 pairs of
    which 5,258 score per type.
    ⚠ THE TARGET IS PROTOCOL-DEFINED, NOT AN EQUILIBRIUM. The 1000-year spin-up is not converged
    (57.9 % of vegetated cells still moving, median +6.8 %/century). What is estimated is "the mix
    the model's standard spin-up reaches", and the paired contrast is legitimate because both arms
    of a pair carry the same drift under the same protocol.
  units: dimensionless
  kind: ratio

data:
  corpus: /p/tmp/jamirp/vegemu/corpus/pilot-v1
  corpus_sha256: "bad787ade3fc609b25cf8ebc87dfd0978e4a869068d9408c73945ec3dc667f99"
  n_rows: 5800

  split:
    kind: blocked_spatial
    k: 5
    seed: 42
    block_degrees: [15, 5]

  leakage_checks:
    - "A held-out cell's 29 perturbed states are held out TOGETHER with the cell: the fold is assigned per cell, never per (cell, climate) pair, so no arm of a cell can train on another arm of the same cell."
    - "The held-out cell's CONTROL composition IS an input, deliberately and disclosed -- in production a real restart for the cell under its present climate always exists. It is also exactly the information the proportional nulls use, which is what makes them fair competitors rather than a handicap."
    - "Whole 15-degree tiles are held out together via vegemu.score.blocked_spatial_folds, the same function that assigned the folds in the null derivation; the 5-degree arm is reported alongside, never substituted."
    - "The feature set excludes lon, lat and cell id; only the nearest_cell_response null sees coordinates. Asserted in the training script before fitting."
    - "CO2 is never a feature and never varies: the pilot forcing writer does not write a CO2 file at all (invariant 8)."
    - "The 30 design points are the SAME at every cell, so a model can learn a per-point average response from the training cells. That is not leakage -- it is precisely the information the level_mean_response null already has, which is why that null is a decision arm."
    - "The null values below were derived by scripts/exp_derive_nulls_composition.py on this corpus BEFORE any model was fitted; the model arm (scripts/exp_model_pilot_composition.py) was written and deliberately not run until this record was sealed."

nulls:
  - id: no_response
    description: "Predict that no type's share changes anywhere. dpred = 0."
    expected:
      statistic: skill_composition_mean
      value: 0.0
      tolerance: 0.000001
      derivation: "analytic: with dpred = 0 the numerator equals the denominator exactly."

  - id: level_mean_response
    description: "The training cells' mean change at that same design point, applied to every held-out cell."
    expected:
      statistic: skill_composition_mean
      value: 0.034332
      tolerance: 0.01
      derivation: "measured, docs/reference/composition-response.md, campaign T-nulls-composition job 2194883. 5 deg arm: 0.040552."

  - id: proportional_median_response
    description: >
      THE BEST NULL. Every type's share moves by the same fraction of what the cell already holds --
      the median across training cells of the proportional change at that design point. This is the
      competitor that matters: it needs no climate information beyond the design point label.
    expected:
      statistic: skill_composition_mean
      value: 0.177858
      tolerance: 0.01
      derivation: "measured, same source. 5 deg arm: 0.188750."

  - id: proportional_mean_response
    description: "The same rule with a mean instead of a median. Unusable, kept because a pre-registered null that returns a wild value is evidence the arm ran."
    expected:
      statistic: skill_composition_mean
      value: -27.619377
      tolerance: 1.0
      derivation: "measured, same source. 5 deg arm: -26.879787."

  - id: nearest_cell_response
    description: "Copy the geographically nearest training cell's change at that design point."
    expected:
      statistic: skill_composition_mean
      value: -0.357056
      tolerance: 0.01
      derivation: "measured, same source. 5 deg arm: -0.320205."

  - id: nearest_analogue_response
    description: "Copy the climatically nearest training cell's change at that design point."
    expected:
      statistic: skill_composition_mean
      value: -0.366684
      tolerance: 0.01
      derivation: "measured, same source. 5 deg arm: -0.291273."

  - id: shuffled_cells
    description: "The truth, permuted across cells. The sanity null."
    expected:
      statistic: skill_composition_mean
      value: -0.835107
      tolerance: 0.05
      derivation: "measured, same source. Identical at both radii because the permutation does not use the folds."

decision_rule:
  statistic: skill_composition_mean
  comparator: model_minus_best_null
  pass_if: "> 0.160"
  arms: [model, no_response, level_mean_response, proportional_median_response, proportional_mean_response, nearest_cell_response, nearest_analogue_response, shuffled_cells]
  multiplicity: none
  power_note: >
    ⚠ THE THRESHOLD IS 0.160 AND NOT THE 0.080 USED BY THE SEALED RESPONSE TEST. It is DERIVED from
    these nulls, never inherited from a sibling experiment, and the derivation is the whole reason
    this number is unusual.

    Under comparator model_minus_best_null the no-power rule scores each null on the model's own
    comparator -- a null's margin is its value minus the best of the REMAINING nulls -- so what
    constrains the threshold is the gap between the best null and the RUNNER-UP, not the best null's
    own value. Here proportional_median_response beats level_mean_response by 0.143526 at 15 deg and
    by 0.148198 at 5 deg. A threshold of 0.080 would therefore BE SATISFIED BY THE BEST NULL ITSELF,
    at both radii, and this experiment would be `invalid` by construction on the day it was sealed.

    0.160 clears the larger of the two gaps with 0.011802 to spare, and no null satisfies it at
    either radius. The pass bar is therefore 0.337858 at 15 deg.

    ⚠ THE LARGE SEPARATION IS WHY THE BAR IS HIGH, NOT A REASON IT IS LOW. The 0.1435 gap is more
    than three times the sealed response test's 0.0414 and was offered as evidence the test is
    well-powered. It is -- for detecting a real effect -- but it raises the threshold by exactly the
    same amount, because a null that far ahead of its runner-up is a null that would otherwise pass.

    If any null returns something other than its stated value the outcome is `invalid`, not fail.
    If any null satisfies pass_if the estimand has no power and the outcome MUST be `invalid`.

  ceiling_note: >
    ⚠ A PASS IS READ AGAINST 0.863852, NEVER AGAINST 1.0. LPJmL-FIT is stochastic and the target is a
    paired contrast of single runs, so a perfect emulator predicts the noise-free change and its
    residual is the model's own realisation noise. Estimated from the historical seed-1 and seed-2
    end-of-spin-up restarts at the same 200 cells: 0.863852 at rho = 0 (independent noise, the
    CONSERVATIVE LOWER BOUND) and 0.931926 at rho = 0.5. Per type at rho = 0: 0.9786 / 0.7499 /
    0.8988 / 0.9817 / 0.9723 / 0.7481 / 0.7176. The bar of 0.337858 is 39.1 % of that lower bound.
    The control and perturbed arms share a random seed, so the true ceiling lies between the two
    figures and PINNING IT NEEDS A SECOND SEED ON A SUBSET OF THE PILOT -- outstanding with line D.
    Until that arm exists the ceiling is a bound and must be quoted as one.

  outcomes_note: >
    THREE DISTINGUISHABLE RESULTS, ALL PRE-NAMED, because the informative part is which.
    (a) model > 0.337858 -- the composition response is learnable, so the synthesiser's copied
    composition is a real capability gap and must stop being a free convenience; this is the only
    outcome that licenses building a composition head.
    (b) model beats proportional_median_response but by less than 0.160 -- a real but insufficient
    signal. It does NOT license a composition head and it does NOT license calling the copy harmless;
    it licenses one more arm, because a gap this size is exactly what an unmeasured ceiling could
    hide.
    (c) model <= proportional_median_response -- the copy costs nothing measurable on this corpus and
    may continue to ship disclosed. ⚠ (c) is NOT evidence that composition does not respond: the
    truth moves in 24.9 % of pairs by the simplest test there is, so (c) would be a statement about
    learnability from these features, never about the model's physics.
    None of the three licenses a claim about composition under a SCENARIO leg: this ensemble
    identifies the response by construction and the scenario legs do not identify it at all
    (X-20260908-heldout-forcing-leg, outcome (c)).

compute:
  launcher: scripts/sbatch_py.sh
  tag: X-composition-response
  partition: priority
  est_core_hours: 4

outputs:
  - path: /p/tmp/jamirp/vegemu/exp/X-20260914-pilot-composition-response/metrics.json
    kind: metrics
