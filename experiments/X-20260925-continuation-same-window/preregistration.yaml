schema_version: 1

exp_id: X-20260925-continuation-same-window
line: X

status: draft

title: "STARTED FROM THE CARBON-MATCHED EMULATED RESTART, DOES THE REAL MODEL LAND IN THE BAND AS OFTEN AS A REAL RUN DOES OVER THE SAME TEN YEARS?"
question: >
  The successor of X-20260925-spinup-restart-continuation (sealed, fail, unedited), with two
  changes and nothing else. (1) THE REFERENCE. That test read a 10-year mean of one continuation
  against a rerun that compares two 250-year means (0.858711), which no 10-year mean of a real run
  reaches: measured on the stored run itself (scripts/diag_window_ceiling.py, job 2319481), a real
  seed's 10-year window lands in band on 0.598 of the 56,986 scored cells and 0.622 of those in
  folds 3-4. The owner decided on 2026-09-25 that "as good as a rerun" for a continuation means as
  good as a real run scored on the same window (docs/decisions/20260925-INT-a-continuation-is-
  judged-against-a-real-run-on-the-same-window.md). (2) THE FILE. The emulated restart now takes
  its trees from the pilot's constant-CO2 spin-ups (vegemu.models.pilot_donors:PilotBank; the
  1999 donors carried the 1999 CO2 into a 276.59 ppm run and died in year 5) and its stem count is
  rescaled per cell until its vegetation carbon matches the screened carbon map's held-out
  prediction (SpinupRule match_vegc; the map writing stem counts and sizes put the old file 20 %
  low).

  THE FALSIFIABLE CLAIM: on the 20,123 tree-bearing scored cells of folds 3 and 4, D = frac(the
  continued emulated restart, years 1-10) - frac(a real run, 10-year window) >= -0.02.

  ⚠ EXPECTED OUTCOME, STATED BEFORE SEALING: FAIL, outcome (b). A dev diagnostic on 51 of the
  1,015 members (journal/X/2026-09b.md, 2026-09-25 evening) put the same construction at frac
  0.561 on its 846 folds-3-4 cells, about D -0.06, with the loss concentrated in a year-5 die-off
  (-9.4 % of vegetation carbon). This test gives the all-cell number with every null beside it.

  ⚠ WHAT A PASS WOULD NOT SAY: vegetation carbon only; one climate (1901-1930); nothing about a
  warmed climate; and the template of each cell is still its own restart_1999 record (grasses,
  soil water, profiles, header), whose information the restart_1999 continuation null measures.

estimand:
  name: asgood_vegc_continuation_same_window
  definition: >
    Truth, band and per-cell pass EXACTLY as X-20260924-spinup-vegc-from-pilot, by the same code
    (scripts/exp_spinup_vegc.py scored_set and score): T_k = seed k's mean VegC over model years
    1450-1699; w = max(0.10, s) from the 1200-1449 halves; an arm x passes against T_k if |x - T_k|
    <= w |T_k|, its per-cell score the mean over k = 1, 2. SCORED CELLS: the scored cells whose
    15-degree tile is in fold 3 or 4 of the sealed tile -> fold map (15 deg, k=5, seed 42): 20,123
    of 56,986 -- the carbon target was CHOSEN on folds 0-2, so only 3-4 are clean.
    THE REFERENCE, per cell: diag_window_ceiling.window_cell_scores(10): each non-overlapping
    10-year window (25 of them) of model years 1450-1699 of seed k, scored against T_(3-k) with
    w, averaged over both seeds and all windows; frac(real, 10) = 0.622260 on these cells. It
    replaces rerun_cell / frac_rerun in exp_spinup_vegc.score, so D = frac(x) - frac(real, 10) and
    the tile bootstrap reads against it. THE STATISTIC: D on continuation years 1-10.
    x FOR A CONTINUATION ARM: the real model's own annual VegC (netCDF, trees + grass) averaged over
    continuation years 1-10, per cell, from the continuation run of the predecessor, unchanged:
    scripts/spinup_continuation.py build (the stored run's saved config; restart from the arm's
    file, 30 shuffled draws of 1901-1930 at model years 1871-1900, constant 276.59 ppm,
    -DFROM_RESTART, Aug-12 2026 binary, npatch 25, no restart written; outputs VegC, globalflux,
    grid, climatyear), the same 1,015 members (members.json sha256 bbfb9768...), which must all
    print the model's completion line; every arm draws the same 30 years (checked).
    THE MODEL ARM: restart_1699_emulated.lpj of runs/spinup-product-v3vegc-global (job 2322007):
    scripts/synth_global.py run --cell-rule vegemu.models.spinup_rule:SpinupRule --synth-kwargs
    {"stop_year": 1699, "litter_rule": "soilc", "match_vegc": true} --donor-rule
    vegemu.models.pilot_donors:PilotBank --donor-opts {"predictions": <equimap-v1
    pred_1901_1930_heldout.parquet>}, template restart_1999 seed 1, predictions = equimap-v1's
    held-out table (sha256 03f7f765...) plus pred_vegc_target = the screen's pred_best (held out
    per fold, T-screen-spinup-vegc-r2/predictions.parquet sha256 99e84e9a...; merged table sha256
    3f678917...). match_vegc: up to 3 re-syntheses scaling stems_per_patch toward
    vegc_target - template grass, tolerance 2 %, cap 4x the map's count; no trees where the target
    is at or below the grass; map-treeless cells stay treeless. As written 2026-09-25 (job 2322007,
    verify PASS, 128,190,246,163 B, sha256 6cef14e080a9bb8c...): 56,986 cells synthesised, 10,434
    passed through, 33,971,450 stems placed, 0 inadmissible; 48,737 cells matched within 2 %, 4,262
    below the grass (no trees written), 2,369 passes exhausted, 1,253 capped, 236 with no tree
    carbon, 129 map-treeless; total written / target 0.996 (first pass 0.806).
    REPORTED BESIDE, NEVER DECIDED ON: years 21-30 (against the same 10-year reference); year 1
    alone (against the 1-year reference, 0.540600 on these cells); all 56,986 cells (10-year
    reference 0.598312); frac; variance explained on log1p; the flat-10 % rate; D by latitude; the
    tile bootstrap interval; and D against the 250-year rerun (0.869478 on these cells), so the
    predecessor's reading stays visible.
  reference_basis: >
    Stored global LPJmL-FIT 5.6.004 spin-up, Historical ground truth, Feb-05 2026 binary, npatch
    25, seeds 1 and 2, model years 1000-1699 at the 276.59 ppm clamp, recycled 1901-1930 GSWP3-W5E5;
    spinup_truth.parquet sha256 37391b3f70c12995... and vegc_spinup_1999.nc of each seed (the
    reference's windows; the script asserts they reproduce the truth's means). Continuations:
    LPJmL-FIT 5.6.004 Aug-12 2026 binary at constant 276.59 ppm. 20,123 cells scored (folds 3-4 of
    the 56,986 with any stem), a level (share of cells in band), the statistic a difference of
    two shares.
  units: dimensionless
  kind: ratio

data:
  corpus: /p/tmp/jamirp/vegemu/corpus/spinup-constco2
  corpus_sha256: "37391b3f70c12995b80f04cf6a8bb61f27cf1b321c2e5b5dd9975280221d56d9"
  plan_sha256: "bbfb9768687727a5a0157788d431b6d5cca4bee6d8c2d52ed37ec31c840d5baa"
  n_rows: 20123

  split:
    kind: blocked_spatial
    k: 5
    seed: 42
    block_degrees: [15]
    scored_folds: [3, 4]

  leakage_checks:
    - "Folds: every scored cell's carbon target (pred_best) comes from recipe models trained on the stored spin-up cells and pilot runs of the OTHER four folds; its stem shares, sizes and soil carbon from equimap-v1 fold models trained on the pilot cells of the other four folds. A scored cell's own tile trains neither."
    - "Selection: the carbon recipe was chosen on D over folds 0-2 only (X-20260925-spinup-vegc-recipe-v2); the scored set here is folds 3-4. The match_vegc rule and its settings were fixed on the 51-member dev sample, whose 846 folds-3-4 cells are among the 20,123 scored here -- DISCLOSED: that sample's result is quoted in the question, so 4 % of the scored cells have been seen."
    - "Donors: PilotBank transplants real stems of the pilot's constant-CO2 spin-ups by climate analogue, never from the target's own fold (the prediction table's fold, checked equal to the bank's on all 200 pilot cells)."
    - "⚠ THE TEMPLATE IS THE CELL'S OWN restart_1999 RECORD (disclosed as in the predecessor): grasses, soil water and enthalpy, the vertical soil and litter profiles (rescaled), the stand's height/density shape and the header; the grass carbon in it sets how many trees match_vegc asks for. Whatever it carries, the restart_1999 continuation null carries too."
    - "No stored truth of 1200-1699 enters the file, the continuation or its config; the truth, its windows and the reference are read only by the scorer."
    - "CO2 is never a feature; the continuation runs at the 276.59 ppm of the scored years (invariant 8)."
    - "Every arm runs the same members, config text (modulo the restart path and the root) and 30 drawn years; the model job refuses otherwise."

# Measured by scripts/exp_continuation_window.py --arm nulls (job 2322044, code 6759f2b,
# out /p/tmp/jamirp/vegemu/exp/X-contwin-nulls, nulls.json sha256 3a98e3ab1761c130...), before the
# model arm's continuation was built. The two continuation nulls are the predecessor's harvested
# arms (runs/spinup-continuation-v1, 1015/1015 members each); the four map lookups are
# X-20260925-spinup-vegc-recipe-v2's (nulls job 2286970, the same 20,123 cells), re-read against the
# 10-year reference: their frac minus 0.622260. The model job reads that nulls.json and holds each
# value to the one below.
nulls:
  - id: restart_1999_continuation
    description: "The stored run's own end state continued identically: what the model does from the one real restart every cell has."
    expected:
      statistic: asgood_vegc_continuation_same_window
      value: -0.340592
      tolerance: 0.001
      derivation: "Measured, job 2322044: folds 3-4 years 1-10 frac 0.2817; tile bootstrap 90 % [-0.3824, -0.2974]; all cells frac 0.2916 (= the predecessor's)."
  - id: previous_emulated_continuation
    description: "The emulated restart this one replaces (1999 donors, no carbon matching), continued identically: the new file must beat the old."
    expected:
      statistic: asgood_vegc_continuation_same_window
      value: -0.349413
      tolerance: 0.001
      derivation: "Measured, job 2322044: folds 3-4 frac 0.2728; [-0.3852, -0.3110]; all cells frac 0.2539 (= the predecessor's model arm)."
  - id: training_mean
    description: "Every cell the mean (log1p) of the training targets, as a static state: the average forest."
    expected:
      statistic: asgood_vegc_continuation_same_window
      value: -0.561409
      tolerance: 0.001
      derivation: "recipe-v2 nulls job 2286970: frac 0.0609 on these cells, minus 0.622260."
  - id: nearest_analogue
    description: "THE BEST NULL. The target of the climatically nearest training cell, as a static state."
    expected:
      statistic: asgood_vegc_continuation_same_window
      value: -0.302899
      tolerance: 0.001
      derivation: "recipe-v2 nulls job 2286970: frac 0.3194, minus 0.622260."
  - id: nearest_geographic
    description: "The target of the nearest training cell on the sphere, as a static state: the address null."
    expected:
      statistic: asgood_vegc_continuation_same_window
      value: -0.381516
      tolerance: 0.001
      derivation: "recipe-v2 nulls job 2286970: frac 0.2407, minus 0.622260."
  - id: shuffled
    description: "The held-out fold's two-seed mean truth permuted within the fold, as a static state."
    expected:
      statistic: asgood_vegc_continuation_same_window
      value: -0.573212
      tolerance: 0.001
      derivation: "recipe-v2 nulls job 2286970: frac 0.0490, minus 0.622260."

decision_rule:
  statistic: asgood_vegc_continuation_same_window
  comparator: model_absolute
  pass_if: ">= -0.02"
  arms: [model, restart_1999_continuation, previous_emulated_continuation, training_mean, nearest_analogue, nearest_geographic, shuffled]
  multiplicity: none
  power_note: >
    The owner's margin: D >= -0.02, i.e. frac(model) >= 0.602260 on these cells. The best null is
    nearest_analogue at -0.302899; no null satisfies the rule, so the estimand has power. If any
    did, the outcome would be `invalid`.
  ceiling_note: >
    THE REFERENCE IS A REAL RUN ON THE SAME WINDOW, 0.622260, NOT 1.0 AND NOT THE 250-YEAR RERUN
    (0.869478). ⚠ A static state (the four map nulls) carries no year-to-year noise, so it is
    advantaged against this reference: an arm that reproduced a static map exactly would score its
    frac. The screened carbon map itself (not an arm, not a null) is at frac 0.606 on these cells,
    i.e. D -0.016 if read this way; a continuation that the model held perfectly still at the
    matched carbon could therefore pass without being as noisy as a real run. Reported, not hidden.
  outcomes_note: >
    PRE-NAMED. (a) D >= -0.02: the model started from the emulated restart lands in band over its
    first decade as often as a real run's decade does, on the held-out cells -- the first pass of
    the restart file, for vegetation carbon. (b) -0.302899 < D < -0.02: better than every null, not
    yet as good as a real run. (c) D <= -0.302899: no better than an analogue lookup. In every
    outcome report years 21-30, year 1 and the all-cell numbers beside it.

compute:
  launcher: scripts/sbatch_py.sh
  tag: X-contwin-metrics
  partition: standard
  est_core_hours: 150

outputs:
  - path: /p/tmp/jamirp/vegemu/exp/X-20260925-continuation-same-window/metrics.json
    kind: metrics
